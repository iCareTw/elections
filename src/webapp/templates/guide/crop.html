<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圈選補照片</title>
<style>
  :root { --ink:#16201d; --muted:#60716c; --paper:#f4efe2; --line:#d9cdb6;
          --accent:#0f766e; --accent-strong:#0b4f49; }
  body { margin:0; padding:20px; color:var(--ink);
    background: radial-gradient(circle at 20% 15%, rgba(15,118,110,.14), transparent 32rem),
                linear-gradient(135deg, #efe4cc 0%, #f8f3e8 44%, #dfe9de 100%);
    min-height:100vh; font-family:"Avenir Next","PingFang TC","Noto Sans TC",sans-serif; }
  h2 { font-family:Georgia,serif; font-size:24px; margin:0 0 4px; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .bar { margin:12px 0; display:flex; gap:8px; align-items:center; }
  .btn { padding:7px 16px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer;
         border:0; text-decoration:none; display:inline-block; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent-strong); }
  .btn-primary:disabled { background:#cbb99a; cursor:not-allowed; }
  .btn-gray { background:transparent; outline:1px solid var(--line); color:var(--muted); }
  .btn-gray:hover { background:rgba(255,255,255,.55); }
  .stage { position:relative; display:inline-block; border:1px solid var(--line);
           background:#fff9ed; line-height:0; border-radius:8px; overflow:hidden; }
  .stage img { display:block; max-width:100%; user-select:none; -webkit-user-drag:none; }
  .sel { position:absolute; border:2px solid #d97706; background:rgba(217,119,6,.2); display:none; pointer-events:none; }
  .warn { background:#fef3c7; border:1px solid #fbbf24; color:#92400e; padding:12px 16px; border-radius:12px; }
</style>
</head>
<body>
  <h2>圈選補照片</h2>

  {% if not has_source %}
  <div class="warn">此候選人無來源 PDF 頁碼,無法圈選補照片。請改用其他方式提供照片。</div>
  <div class="bar"><a class="btn btn-gray" href="/guide/candidate/{{ candidate_id }}">← 返回候選人</a></div>
  {% else %}
  <p class="hint">在下方公報頁面上,用滑鼠拖曳框住正確的大頭照區塊,再按「確認裁切」。</p>
  <div class="bar">
    <form id="cropForm" method="post" action="/guide/candidate/{{ candidate_id }}/crop">
      <input type="hidden" name="x0" id="x0"><input type="hidden" name="y0" id="y0">
      <input type="hidden" name="x1" id="x1"><input type="hidden" name="y1" id="y1">
      <button class="btn btn-primary" id="submitBtn" type="submit" disabled>確認裁切</button>
    </form>
    <a class="btn btn-gray" id="cancelBtn" href="/guide/candidate/{{ candidate_id }}">取消</a>
  </div>

  <div class="stage" id="stage">
    <img id="pageImg" src="/guide/candidate/{{ candidate_id }}/page-image" alt="公報頁面">
    <div class="sel" id="sel"></div>
  </div>

  <script>
  (function(){
    var stage = document.getElementById('stage');
    var img = document.getElementById('pageImg');
    var sel = document.getElementById('sel');
    var btn = document.getElementById('submitBtn');
    var cancel = document.getElementById('cancelBtn');
    var startX=0, startY=0, drawing=false;

    function rectOf(){ return img.getBoundingClientRect(); }
    function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

    stage.addEventListener('mousedown', function(e){
      var r = rectOf();
      drawing = true;
      startX = clamp(e.clientX - r.left, 0, r.width);
      startY = clamp(e.clientY - r.top, 0, r.height);
      sel.style.display='block';
      sel.style.left=startX+'px'; sel.style.top=startY+'px';
      sel.style.width='0px'; sel.style.height='0px';
      e.preventDefault();
    });
    window.addEventListener('mousemove', function(e){
      if(!drawing) return;
      var r = rectOf();
      var cx = clamp(e.clientX - r.left, 0, r.width);
      var cy = clamp(e.clientY - r.top, 0, r.height);
      sel.style.left = Math.min(startX,cx)+'px';
      sel.style.top = Math.min(startY,cy)+'px';
      sel.style.width = Math.abs(cx-startX)+'px';
      sel.style.height = Math.abs(cy-startY)+'px';
    });
    window.addEventListener('mouseup', function(e){
      if(!drawing) return;
      drawing = false;
      var r = rectOf();
      var cx = clamp(e.clientX - r.left, 0, r.width);
      var cy = clamp(e.clientY - r.top, 0, r.height);
      var x0 = Math.min(startX,cx)/r.width,  x1 = Math.max(startX,cx)/r.width;
      var y0 = Math.min(startY,cy)/r.height, y1 = Math.max(startY,cy)/r.height;
      if(x1-x0 < 0.005 || y1-y0 < 0.005){ btn.disabled = true; return; }  // 太小視為未選
      document.getElementById('x0').value = x0.toFixed(5);
      document.getElementById('y0').value = y0.toFixed(5);
      document.getElementById('x1').value = x1.toFixed(5);
      document.getElementById('y1').value = y1.toFixed(5);
      btn.disabled = false;
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); btn.click(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel.click(); }
    });
  })();
  </script>
  {% endif %}
</body>
</html>
